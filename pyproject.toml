[project]
name = "attenomy-ml-internship"
version = "0.1.0"
description = "Official Starter Repository for Attenomy Machine Learning Engineering Interns"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
